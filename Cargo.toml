[workspace]

[package]
name = "tracing-estuary"
version = "0.1.0"
authors = ["Tunglies <tunglies.dev@outlook.com>"]
edition = "2024"
description = "Where the `log` rivers meet the `tracing` sea: a layered subscriber pipeline with a size-rotating, bounded, non-blocking file sink"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tunglies/tracing-estuary"
keywords = ["logging", "tracing", "rotation", "subscriber", "flexi-logger"]
categories = ["development-tools::debugging"]

[lib]
name = "tracing_estuary"

[features]
default = []
# tokio-console layer, coexists with the file/stdout layers.
tokio-trace = ["dep:console-subscriber", "dep:tokio"]
# Perfetto/chrome trace layer, gated at runtime by CV_TRACE_CHROME=<path>.
chrome-trace = []
# ANSI styling for the stdout console format (dev builds).
color = ["dep:nu-ansi-term"]

[dependencies]
anyhow = "1.0"
parking_lot = "0.12"
compact_str = "0.10"
log = "0.4"
flexi_logger = "0.31"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "std",
  "registry",
  "fmt",
  "ansi",
  "env-filter",
  "tracing-log",
] }
tracing-log = "0.2"
tokio = { version = "1", features = ["rt"], optional = true }
console-subscriber = { version = "0.5", optional = true }
nu-ansi-term = { version = "0.50", optional = true }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
async_yields_async = "deny"
await_holding_lock = "deny"
branches_sharing_code = "deny"
clone_on_ref_ptr = "warn"
cloned_instead_of_copied = "deny"
cognitive_complexity = "deny"
collection_is_never_read = "deny"
copy_iterator = "deny"
correctness = { level = "deny", priority = -1 }
dbg_macro = "warn"
equatable_if_let = "deny"
expect_used = "warn"
expl_impl_clone_on_copy = "deny"
future_not_send = "deny"
iter_on_empty_collections = "deny"
iter_on_single_items = "deny"
iter_with_drain = "deny"
large_const_arrays = "warn"
large_futures = "deny"
large_stack_arrays = "warn"
large_types_passed_by_value = "deny"
missing_const_for_fn = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
needless_collect = "deny"
needless_continue = "deny"
needless_pass_by_ref_mut = "deny"
needless_raw_string_hashes = "deny"
option_as_ref_cloned = "deny"
or_fun_call = "deny"
panic = "deny"
pathbuf_init_then_push = "deny"
rc_clone_in_vec_init = "warn"
rc_mutex = "deny"
redundant_clone = "deny"
redundant_else = "deny"
significant_drop_in_scrutinee = "deny"
significant_drop_tightening = "deny"
string_lit_as_bytes = "deny"
suspicious = { level = "deny", priority = -1 }
suspicious_operation_groupings = "deny"
todo = "warn"
trait_duplication_in_bounds = "deny"
tuple_array_conversions = "deny"
unimplemented = "deny"
unnecessary_self_imports = "deny"
unnecessary_wraps = "deny"
unused_async = "deny"
unused_trait_names = "deny"
unwrap_used = "warn"
use_self = "deny"
useless_let_if_seq = "deny"
wildcard_imports = "deny"
