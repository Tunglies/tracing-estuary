name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # The release-only stdout formatter only compiles without
      # debug_assertions, so lint both profiles.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --release --all-targets --all-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features ${{ matrix.profile == 'release' && '--release' || '' }}
